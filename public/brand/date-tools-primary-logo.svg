      <stop offset="1" stop-color="#5e4df6"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="164" y1="118" x2="378" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#45f0d4"/>
      <stop offset="1" stop-color="#22c8a8"/>
    </linearGradient>
    <filter id="softShadow" x="-18%" y="-18%" width="136%" height="136%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <rect x="42" y="42" width="428" height="428" rx="104" fill="url(#frameGradient)" opacity="0.18"/>
