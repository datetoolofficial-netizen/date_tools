<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Date Tools Primary Logo</title>
  <desc id="desc">A modern date tools logo combining a calendar, clock hands, and a conversion mark.</desc>
  <defs>
    <linearGradient id="frameGradient" x1="82" y1="68" x2="440" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a8ff"/>
